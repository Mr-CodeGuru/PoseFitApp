name: Build Pure-Rust Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            PoseFitApp/target/
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-

      - name: Check Formatting
        working-directory: PoseFitApp
        run: cargo fmt --all --check

      - name: Compile Workspace Check
        working-directory: PoseFitApp
        run: cargo check --workspace

      - name: Run Test Suite (71 Tests)
        working-directory: PoseFitApp
        run: cargo test --workspace --verbose

      - name: Strict Clippy Linter
        working-directory: PoseFitApp
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-android-apk:
    name: Cross-Compile & Package Pure-Rust APK
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Cache cargo-ndk Binary
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v4.1.2

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Cross-Compile libposefit_android.so (ARM64)
        working-directory: PoseFitApp
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -o target/android-apk/lib build --package posefit-android --release

      - name: Package & Sign Pure-Rust APK (aapt2 + zipalign + apksigner)
        working-directory: PoseFitApp
        run: |
          # 1. Resolve Android platform android.jar
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | sort -V | tail -n 1)
          echo "Using Android platform: $ANDROID_JAR"

          # 2. Resolve Android SDK build-tools (aapt2, zipalign, apksigner)
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -name "aapt2" -exec dirname {} \; | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"

          # 3. Compile plain-text AndroidManifest.xml into Android Binary XML (AXML)
          "$BUILD_TOOLS_DIR/aapt2" link \
            -I "$ANDROID_JAR" \
            --manifest posefit-android/AndroidManifest.xml \
            -o target/PoseFit-base.apk

          # 4. Add native compiled ARM64 library into lib/arm64-v8a/
          cd target/android-apk
          zip -u -r ../PoseFit-base.apk lib/
          cd ../..

          # 5. 4-byte Zipalign for direct memory-mapped native library execution
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 target/PoseFit-base.apk target/PoseFit-aligned.apk

          # 6. Generate debug signing keystore
          keytool -genkey -v -keystore target/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # 7. Sign APK with Android v1 + v2 + v3 signature schemes
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks target/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out target/PoseFit-release.apk \
            target/PoseFit-aligned.apk

          # 8. Verify APK integrity and signatures
          "$BUILD_TOOLS_DIR/apksigner" verify -v target/PoseFit-release.apk

      - name: Upload PoseFit.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoseFit-release-apk
          path: PoseFitApp/target/PoseFit-release.apk
          if-no-files-found: error
          retention-days: 30
